<text x="68" y="1632" fill="#67e8f9" font-size="15" font-weight="700">READING GUIDE</text>
<text x="68" y="1658" class="small">• 单线/多线为持续平均；MAX 为网卡计数器约 1 秒滚动峰值。容量测试会产生实际上下行流量。</text>
<text x="68" y="1682" class="small">• HTTP Jitter 为成功样本标准差；HTTP Loss 为失败请求占比。不同端点和时段会影响结果。</text>
<text x="68" y="1706" class="small">• 三网路由用于快速筛选；最终请结合 MTR、Traceroute、晚高峰复测与实际业务。</text>
