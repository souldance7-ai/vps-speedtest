<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">LazyVPS Airport Full Tester 範例報告</title>
  <desc id="desc">使用文件專用測試資料的全節點容量、穩定性、解鎖與出口IP排行榜範例</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151333"/></linearGradient>
    <linearGradient id="hero"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
    <style>text{font-family:Inter,'Microsoft YaHei','PingFang TC',system-ui,sans-serif}.small{fill:#94a3b8;font-size:14px}.label{fill:#8fa6c5;font-size:15px}.mono{font-family:Consolas,monospace}</style>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1215" cy="75" r="105" fill="#7c3aed" opacity=".13" filter="url(#glow)"/>
  <rect x="42" y="38" width="8" height="92" rx="4" fill="url(#hero)"/>
  <text x="70" y="78" fill="#e6fbff" font-size="36" font-weight="800">LAZYVPS AIRPORT FULL TESTER</text>
  <text x="70" y="111" fill="#8fa6c5" font-size="18">DEMO · 全節點容量 / 穩定性 / 解鎖 / 出口身份報告（已脫敏）</text>
  <text x="1350" y="76" text-anchor="end" fill="#67e8f9" font-size="18">v2.0.0</text>
  <g>
    <rect x="42" y="154" width="306" height="108" rx="18" fill="#101d33" stroke="#31425c"/><text x="62" y="188" class="label">NODES</text><text x="62" y="235" fill="#22d3ee" font-size="28" font-weight="800">12</text>
    <rect x="372" y="154" width="306" height="108" rx="18" fill="#101d33" stroke="#31425c"/><text x="392" y="188" class="label">AVG SCORE</text><text x="392" y="235" fill="#34d399" font-size="28" font-weight="800">84.6</text>
    <rect x="702" y="154" width="306" height="108" rx="18" fill="#101d33" stroke="#31425c"/><text x="722" y="188" class="label">TOP NODE</text><text x="722" y="235" fill="#fbbf24" font-size="22" font-weight="800">Demo-TW-01</text>
    <rect x="1032" y="154" width="326" height="108" rx="18" fill="#101d33" stroke="#31425c"/><text x="1052" y="188" class="label">EXIT MATCH</text><text x="1052" y="235" fill="#c084fc" font-size="28" font-weight="800">100%</text>
  </g>
  <rect x="42" y="292" width="1316" height="64" rx="14" fill="#0b1628" stroke="#263752"/>
  <text x="66" y="332" class="small">RANK</text><text x="130" y="332" class="small">NODE</text><text x="505" y="332" class="small">EXIT IP / ASN</text><text x="760" y="332" class="small">DOWN S/N/MAX</text><text x="990" y="332" class="small">UP S/N/MAX</text><text x="1195" y="332" class="small">P95 / LOSS</text><text x="1320" y="332" text-anchor="end" class="small">SCORE</text>
  <g>
    <rect x="42" y="374" width="1316" height="72" rx="14" fill="#101d33" stroke="#263752"/><text x="76" y="417" text-anchor="middle" fill="#67e8f9" font-size="20" font-weight="700">1</text><text x="130" y="405" fill="#f8fafc" font-size="18" font-weight="700">Demo-TW-01</text><text x="130" y="428" class="small">API 28 ms · Unlock 24/26</text><text x="505" y="405" fill="#e2e8f0" font-size="16" class="mono">203.0.113.10</text><text x="505" y="428" class="small">AS64500 · TW</text><text x="760" y="417" fill="#67e8f9" font-size="16" class="mono">286 / 632 / 718</text><text x="990" y="417" fill="#d8b4fe" font-size="16" class="mono">118 / 221 / 249</text><text x="1195" y="417" fill="#e2e8f0" font-size="15" class="mono">121 ms / 0%</text><text x="1320" y="417" text-anchor="end" fill="#34d399" font-size="23" font-weight="800">92.4 A+</text>
    <rect x="42" y="460" width="1316" height="72" rx="14" fill="#0d192c" stroke="#263752"/><text x="76" y="503" text-anchor="middle" fill="#67e8f9" font-size="20" font-weight="700">2</text><text x="130" y="491" fill="#f8fafc" font-size="18" font-weight="700">Demo-TW-02</text><text x="130" y="514" class="small">API 36 ms · Unlock 23/26</text><text x="505" y="491" fill="#e2e8f0" font-size="16" class="mono">203.0.113.11</text><text x="505" y="514" class="small">AS64500 · TW</text><text x="760" y="503" fill="#67e8f9" font-size="16" class="mono">221 / 518 / 590</text><text x="990" y="503" fill="#d8b4fe" font-size="16" class="mono">92 / 187 / 212</text><text x="1195" y="503" fill="#e2e8f0" font-size="15" class="mono">146 ms / 0%</text><text x="1320" y="503" text-anchor="end" fill="#38bdf8" font-size="23" font-weight="800">84.1 A</text>
    <rect x="42" y="546" width="1316" height="72" rx="14" fill="#101d33" stroke="#263752"/><text x="76" y="589" text-anchor="middle" fill="#67e8f9" font-size="20" font-weight="700">3</text><text x="130" y="577" fill="#f8fafc" font-size="18" font-weight="700">Demo-JP-03</text><text x="130" y="600" class="small">API 51 ms · Unlock 20/26</text><text x="505" y="577" fill="#e2e8f0" font-size="16" class="mono">203.0.113.22</text><text x="505" y="600" class="small">AS64501 · JP</text><text x="760" y="589" fill="#67e8f9" font-size="16" class="mono">168 / 402 / 459</text><text x="990" y="589" fill="#d8b4fe" font-size="16" class="mono">73 / 144 / 169</text><text x="1195" y="589" fill="#e2e8f0" font-size="15" class="mono">188 ms / 1.2%</text><text x="1320" y="589" text-anchor="end" fill="#fbbf24" font-size="23" font-weight="800">72.8 B</text>
  </g>
  <text x="42" y="672" class="small">已脫敏示例：IP 使用 RFC 5737 文件網段、ASN 使用文件保留號 · 配置密碼不寫入報告</text>
</svg>
